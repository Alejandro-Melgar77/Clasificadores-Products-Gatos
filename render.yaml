services:
  # Servicio 1: API de Tienda de Productos
  - type: web
    name: api-tienda-productos
    runtime: python
    rootDir: tienda_productos/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true

  # Servicio 2: API de Clasificador Perro / Gato / Ninguno
  - type: web
    name: api-perros-gatos
    runtime: python
    rootDir: perros_gatos/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
